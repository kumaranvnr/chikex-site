<app-header></app-header>

<!-- Page Title-->
<div class="page-title-overlap bg-dark pt-4">
  <div class="container d-lg-flex justify-content-between py-2 py-lg-3">
    <div class="order-lg-2 mb-3 mb-lg-0 pt-lg-2">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb breadcrumb-light flex-lg-nowrap justify-content-center justify-content-lg-start">
          <li class="breadcrumb-item"><a class="text-nowrap" routerLink="/"><i class="ci-home"></i>Home</a></li>
          <li class="breadcrumb-item text-nowrap"><a href="javascript:void(0);">Account</a>
          </li>
          <li class="breadcrumb-item text-nowrap active" aria-current="page">Wishlist</li>
        </ol>
      </nav>
    </div>
    <div class="order-lg-1 pe-lg-4 text-center text-lg-start">
      <h1 class="h3 text-light mb-0">My wishlist</h1>
    </div>
  </div>
</div>
<div class="container pb-5 mb-2 mb-md-4">
  <div class="row">
    <!-- Sidebar-->
    <aside class="col-lg-4 pt-4 pt-lg-0 pe-xl-5">
      <app-account-sidebar></app-account-sidebar>
    </aside>
    <!-- Content  -->
    <section class="col-lg-8">
      <!-- Toolbar-->
      <div class="d-none d-lg-flex justify-content-between align-items-center pt-lg-3 pb-4 pb-lg-5 mb-lg-3">
        <h6 class="fs-base text-light mb-0">List of items you added to wishlist:</h6>
        <!-- <a class="btn btn-primary btn-sm"
          routerLink="/account/signin"><i class="ci-sign-out me-2"></i>Sign out</a> -->
      </div>
      <!-- Wishlist-->
      <!-- Item-->
      <div class="d-sm-flex justify-content-between mt-lg-4 mb-4 pb-3 pb-sm-2 border-bottom"
        *ngFor="let data of wishlistDatas; let i = index;trackBy:fromDataResolver.identify;">
        <div class="d-block d-sm-flex align-items-start text-center text-sm-start">
          <a class="d-block flex-shrink-0 mx-auto me-sm-4" href="javascript:void(0);" style="width: 10rem;"><img
              src="{{data.img_url}}" alt="{{data.title}}"></a>
          <div class="pt-2">
            <h3 class="product-title fs-base mb-2"><a href="javascript:void(0);">{{data.content}}</a></h3>
            <div class="fs-lg text-accent pt-2">${{data.display_price}}</div>
          </div>
        </div>
        <div class="pt-2 ps-sm-3 mx-auto mx-sm-0 text-center">
          <button class="btn btn-outline-danger btn-sm" type="button" (click)="removeData($event)"><i
              class="ci-trash me-2"></i>Remove</button>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Footer-->
<app-footer></app-footer>

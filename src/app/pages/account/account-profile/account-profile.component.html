<app-header></app-header>

<!-- Page Title-->
<div class="page-title-overlap bg-dark pt-4">
  <div class="container d-lg-flex justify-content-between py-2 py-lg-3">
    <div class="order-lg-2 mb-3 mb-lg-0 pt-lg-2">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb breadcrumb-light flex-lg-nowrap justify-content-center justify-content-lg-start">
          <li class="breadcrumb-item"><a class="text-nowrap" routerLink="/"><i class="ci-home"></i>Home</a></li>
          <li class="breadcrumb-item text-nowrap"><a href="javascript:void(0);">Account</a>
          </li>
          <li class="breadcrumb-item text-nowrap active" aria-current="page">Profile info</li>
        </ol>
      </nav>
    </div>
    <div class="order-lg-1 pe-lg-4 text-center text-lg-start">
      <h1 class="h3 text-light mb-0">Profile info</h1>
    </div>
  </div>
</div>
<div class="container pb-5 mb-2 mb-md-4">
  <div class="row">
    <!-- Sidebar-->
    <aside class="col-lg-4 pt-4 pt-lg-0 pe-xl-5">
      <app-account-sidebar></app-account-sidebar>
    </aside>
    <!-- Content  -->
    <section class="col-lg-8">
      <!-- Toolbar-->
      <div class="d-none d-lg-flex justify-content-between align-items-center pt-lg-3 pb-4 pb-lg-5 mb-lg-3">
        <h6 class="fs-base text-light mb-0">Update you profile details below:</h6>
        <!-- <a class="btn btn-primary btn-sm"
          href="javascript:void(0);" (click)="SignOut()"><i class="ci-sign-out me-2"></i>Sign out</a> -->
      </div>
      <!-- Profile form-->
      <form [formGroup]="AccountProfile" (ngSubmit)="updateProfile()">
        <div class="bg-secondary rounded-3 p-4 mb-4">
          <div class="d-flex align-items-center"><img class="rounded" src="{{picture}}" width="90" alt="{{name}}"
              id="user_profile">
            <div class="ps-3">
              <label for="customer-image-input" class="btn btn-light btn-shadow btn-sm mb-2" type="button"><i
                  class="ci-loading me-2"></i>Change avatar</label>
              <input class="form-control d-none" id="customer-image-input" type="file" formControlName="picture"
                accept="image/png, image/gif, image/jpeg" (change)="fileChange($event)">
              <div class="p mb-0 fs-ms text-muted">Upload JPG, GIF or PNG image. 300 x 300 required.</div>
            </div>
          </div>
        </div>
        <div class="row gx-4 gy-3">
          <div class="col-sm-6">
            <label class="form-label" for="account-fn">First Name</label>
            <input class="form-control" type="text" id="account-fn" formControlName="given_name">
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="account-ln">Last Name</label>
            <input class="form-control" type="text" id="account-ln" formControlName="family_name">
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="account-email">Email Address</label>
            <input class="form-control" type="email" id="account-email" formControlName="email" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="account-phone">Phone Number</label>
            <input class="form-control" type="text" id="account-phone" formControlName="mobile" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="account-pass">New Password</label>
            <div class="password-toggle">
              <input [type]="NPasswordType ? 'text' : 'password'" class="form-control pe-5 password-input"
                formControlName="password" id="password-input">
              <label class="password-toggle-btn" aria-label="Show/hide password" (click)="toggleNewPassword()">
                <i _ngcontent-tdd-c114="" class="" [ngClass]="NPasswordType ? 'ci-eye' : 'ci-eye-off'"></i>
              </label>
              <div class="invalid-feedback">
                Please enter password
              </div>
            </div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="account-confirm-pass">Confirm Password</label>
            <div class="password-toggle">
              <input class="form-control" [type]="CPasswordType ? 'text' : 'password'" id="account-confirm-pass"
                formControlName="cpassword">
              <label class="password-toggle-btn" aria-label="Show/hide password" (click)="toggleConfirmPassword()">
                <i _ngcontent-tdd-c114="" class="" [ngClass]="CPasswordType ? 'ci-eye' : 'ci-eye-off'"></i>
              </label>
            </div>
          </div>
          <div class="col-12">
            <hr class="mt-2 mb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="subscribe_me" [checked]="notify"
                  formControlName="notify_me">
                <label class="form-check-label" for="subscribe_me">Subscribe me to Newsletter</label>
              </div>
              <button class="btn btn-primary mt-3 mt-sm-0" type="submit">Update
                profile</button>
            </div>
          </div>
        </div>
      </form>
    </section>
  </div>
</div>

<!-- Footer-->
<app-footer></app-footer>

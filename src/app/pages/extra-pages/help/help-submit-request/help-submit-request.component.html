    <div class="col-lg-9">
      <div class="alert alert-info d-flex fs-sm mb-4" role="alert">
        <div class="alert-icon"><i class="ci-announcement"></i></div>
        <div>Our friendly Support team is always here to help you. Begin by selecting a topic we can help you with.
        </div>
      </div>
      <form class="needs-validation" novalidate [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="row gx-4 gy-3">
          <div class="col-sm-6">
            <label class="form-label" for="help-topic">Select a topic <strong class='text-danger'>*</strong></label>
            <select class="form-select" required id="help-topic" formControlName="topic"
              [ngClass]="{ 'is-invalid': submitted && form['topic'].errors }">
              <option value>—</option>
              <option value="General">General Enquiry</option>
              <option value="Account">Managing Account</option>
              <option value="Payment">Payment Methods</option>
              <option value="Delivery">Delivery Information</option>
              <option value="Refund">Refund Policy</option>
              <option value="Deletion">Account Deletion</option>
              <option value="FeedBack">Feed Back</option>
            </select>
            <div class="invalid-feedback">Please choose a topic!</div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="help-subject">Request Subject </label>
            <input class="form-control" type="text" id="help-subject" formControlName="subject">
          </div>
          <div class="col-12">
            <label class="form-label" for="help-message">Request Message <strong class='text-danger'>*</strong></label>
            <textarea class="form-control" rows="6" required id="help-message" formControlName="message"
              [ngClass]="{ 'is-invalid': submitted && form['message'].errors }"></textarea>
            <div class="invalid-feedback">Please provide a detailed description of your problem!</div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="help-name">Your Name <strong class='text-danger'>*</strong></label>
            <input class="form-control" type="text" required id="help-name" formControlName="name"
              [ngClass]="{ 'is-invalid': submitted && form['name'].errors }">
            <div class="invalid-feedback">Please enter your name!</div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="help-email">Your Email <strong class='text-danger'>*</strong></label>
            <input class="form-control" type="email" required id="help-email" formControlName="email"
              [ngClass]="{ 'is-invalid': submitted && form['email'].errors }">
            <div class="invalid-feedback">Please enter valid email address!</div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="help-url">Mobile</label>
            <input class="form-control" type="text" id="help-url" formControlName="mobile">
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="help-file">Attachments</label>
            <input class="form-control" type="file" id="help-file"
              (change)="uploadImage($event,contactForm, 'attachment_url')" accept="image/*">
            <ng-container *ngIf="request_submit">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Loading...
            </ng-container>
          </div>
          <div class="col-12 pt-2">
            <button class="btn btn-primary me-4" type="submit" [disabled]="canDisable()">Submit a request</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

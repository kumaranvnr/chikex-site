<app-header></app-header>

<!-- Page Title (Light)-->
<app-breadcrumbs title="Join Us" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<!-- Section: We are hiring-->

<section class="row g-0 activation-area">
    <div class="col-md-6 bg-position-center bg-size-cover bg-secondary order-md-2"
        style="min-height: 15rem; background-image: url(assets/img/about/05.jpg);"></div>
    <div class="col-md-6 px-3 px-md-5 py-5 order-md-1">
        <div class="mx-auto py-lg-5" style="max-width: 35rem;">
            <h2 class="h3 mb-2">We are hiring new talents</h2>
            <p class="fs-sm text-muted pb-2">If you want to be part of our team please submit you CV using
                the form below:</p>
            <form class="needs-validation row g-4" method="post" novalidate [formGroup]="aboutForm"
                (ngSubmit)="onSubmit()">
                <div class="col-sm-6">
                    <input class="form-control" type="text" placeholder="Your name" required formControlName="name"
                        [ngClass]="{ 'is-invalid': submitted && form['name'].errors }">
                </div>
                <div class="col-sm-6">
                    <input class="form-control" type="email" placeholder="Your email" required formControlName="email"
                        [ngClass]="{ 'is-invalid': submitted && form['email'].errors }">
                </div>
                <div class="col-12">
                    <textarea class="form-control" rows="4" placeholder="Message" required formControlName="message"
                        [ngClass]="{ 'is-invalid': submitted && form['message'].errors }"></textarea>
                </div>
                <div class="col-12">
                    <input class="form-control" type="file" required formControlName="file"
                        [ngClass]="{ 'is-invalid': submitted && form['file'].errors }">
                </div>
                <div class="col-12">
                    <button class="btn btn-info btn-shadow" type="submit">Submit your CV</button>
                </div>
            </form>
        </div>
    </div>
</section>

<!-- Footer-->
<app-footer></app-footer>

<div class="modal-content">
    <div class="modal-header bg-secondary">
        <h4 class="modal-title">Add new address</h4>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"
            (click)="closemodal()"></button>
    </div>
    <div class="modal-body ">
        <div class="mb-3">
            <input type="text" class="form-control" [(ngModel)]="map_address" id="map_address">
        </div>
        <div #mapContainer style="height: 400px; position: relative;">

        </div>
    </div>
    <div class="modal-footer">
        <div class="row col-lg-12 d-flex flex-row align-items-center">
            <div class="d-flex mb-1 justify-content-end"><button type="button" class="btn btn-primary"
                    (click)="confirmAdreess()">
                    Confirm Location</button></div>
        </div>
    </div>
</div>
